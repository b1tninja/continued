  # --- Families not yet measured (plans/model-families-2026-11.md, rows I2 and
  # I4). Nothing below has been run. Prices are the AWS model cards read
  # 2026-11-10 where the card has one (US CRIS, standard tier); a row without
  # `price` is scored at the CLI's fallback rate and flagged "estimated".
  # Run the Tier 1 probe (bench/probe.mjs) before the battery.
  - id: kimi-k3
    provider: bedrock
    model: us.moonshotai.kimi-k3
    family: kimi
    contextLength: 1000000
    price:
      {
        input: 3.3,
        output: 16.5,
        cacheRead: 0.33,
        cacheWrite: 4.125,
        source: AWS Kimi K3 model card US CRIS 2026-11-10,
      }
    efforts: [none, low, medium, high]
    effort: bedrock-reasoning
    notes: unprobed; reasoning_effort on Converse is documented but not validated by AWS, default is max (run --effort low first); Converse fails on replayed reasoning blocks per AWS; output burns 10x quota

