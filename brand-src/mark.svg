<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Continuous mark: an endless loop, one stroke in the brand gradient (the stops
       the CLI paints its loop with, extensions/cli/src/asciiArt.ts) on a deep-indigo
       badge with a thin indigo-to-violet border and a soft glow, the same light the
       chat input's border carries (gui/src/components/mainInput/GradientBorder.tsx).
       The travelling dot exists only in the running app (gui/src/components/svg/LoopIcon).
       Regenerate every derived asset with: node brand-src/render.js -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="loop" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="412" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#edge)" stroke-width="12" filter="url(#glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <path d="M256 256 C300 172 412 172 412 256 C412 340 300 340 256 256 C212 172 100 172 100 256 C100 340 212 340 256 256 Z" fill="none" stroke="url(#loop)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="27" y="27" width="458" height="458" rx="105" fill="none" stroke="url(#edge)" stroke-width="6"/>
</svg>
