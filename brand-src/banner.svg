<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <!-- The mark's own gradients, copied from mark.svg (ids prefixed so they do not clash with bg) -->
    <linearGradient id="mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="mark-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark-loop" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="412" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <!-- The mark from mark.svg, scaled to 320px and centred vertically on the left -->
  <g transform="translate(120 240) scale(0.625)">
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#mark-bg)"/>
    <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#mark-shine)"/>
    <path d="M256 256 C300 172 412 172 412 256 C412 340 300 340 256 256 C212 172 100 172 100 256 C100 340 212 340 256 256 Z" fill="none" stroke="url(#mark-loop)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="350.5" cy="193" r="30" fill="#67E8F9"/>
  </g>
  <text x="520" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="150" font-weight="600" fill="#EEF2FF">Continuous</text>
  <text x="524" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" fill="#A5F3FC">AI code agent for VS Code, community fork</text>
</svg>
