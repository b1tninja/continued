    <rect x="32" y="32" width="448" height="448" rx="96" fill="#EEF2FF" fill-opacity="0.08"/>
    <path d="M256 256 C300 172 412 172 412 256 C412 340 300 340 256 256 C212 172 100 172 100 256 C100 340 212 340 256 256 Z" fill="none" stroke="#EEF2FF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="35" y="35" width="442" height="442" rx="93" fill="none" stroke="url(#edge)" stroke-width="6"/>
  </g>
  <text x="520" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="150" font-weight="600" fill="#EEF2FF">Continuous</text>
  <text x="524" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" fill="#A5F3FC">AI code agent for VS Code, community fork</text>
