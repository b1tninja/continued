<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Continuous mark: an endless loop, one stroke in the brand gradient (the stops
       the CLI paints its loop with, extensions/cli/src/asciiArt.ts) with a cyan dot
       travelling along it. The same figure is the Loop mark in the app
       (gui/src/components/svg/LoopIcon). Regenerate every derived asset with:
       node brand-src/render.js -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="loop" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="412" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#shine)"/>
  <path d="M256 256 C300 172 412 172 412 256 C412 340 300 340 256 256 C212 172 100 172 100 256 C100 340 212 340 256 256 Z" fill="none" stroke="url(#loop)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="350.5" cy="193" r="30" fill="#67E8F9"/>
</svg>
