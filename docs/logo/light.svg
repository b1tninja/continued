<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Continuous mark: an endless loop, one stroke in a blue-to-purple gradient on a
         dark navy badge framed by a thin blue-to-purple line (starting at #4C8DFF, the
         colour of the cn CLI's prompt box border) with a faint glow. No ring around the loop.
         The travelling dot exists only in the running app (gui/src/components/svg/LoopIcon).
         Regenerate every derived asset with: node brand-src/render.js -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2455"/><stop offset="1" stop-color="#150F3D"/></linearGradient>
<linearGradient id="loop" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="412" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512"><stop offset="0" stop-color="#4C8DFF"/><stop offset="0.55" stop-color="#8B7CF6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/><rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="url(#edge)" stroke-width="10" filter="url(#glow)" opacity="0.7"/><rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="url(#edge)" stroke-width="5"/>
<path d="M256 256 C300 172 412 172 412 256 C412 340 300 340 256 256 C212 172 100 172 100 256 C100 340 212 340 256 256 Z" fill="none" stroke="url(#loop)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></svg>
