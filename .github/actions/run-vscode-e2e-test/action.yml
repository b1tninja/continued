name: "Run VS Code E2E Test"
description: "Run a single VS Code E2E test with all required setup"
inputs:
  test_file:
    description: "E2E test file to run"
    required: true
  command:
    description: "Command to run (e2e:ci:run or e2e:ci:run-yaml)"
    required: true
  ssh_key:
    description: "SSH private key for testing"
    required: false
  ssh_host:
    description: "SSH host for testing"
    required: false
  is_fork:
    description: "Whether this is a fork (affects SSH tests)"
    required: false
    default: "false"
  github_token:
    description: "GitHub token for authenticated API requests"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      id: node
      with:
        node-version-file: ".nvmrc"

    # Cache policy (docs/ci-caching.md). Pull requests restore; only main saves the big entries
    # (the VS Code download is 700 MB, and every pull request ref used to keep its own copy).
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: vscode-node-modules-cache
      with:
        path: extensions/vscode/node_modules
        key: ${{ runner.os }}-vscode-node-modules-node${{ steps.node.outputs.node-version }}-${{ hashFiles('extensions/vscode/package-lock.json') }}

    # Restore only, from what setup-component saved after a clean install. Prepackage
    # edits core/node_modules, so this job must not save it, and npm ci would delete it.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: core-node-modules-cache
      with:
        path: core/node_modules
        key: ${{ runner.os }}-core-node-modules-node${{ steps.node.outputs.node-version }}-${{ hashFiles('core/package-lock.json') }}

    # The extensions the tests install from the marketplace (install-e2e-extensions.js skips one
    # that is already there). The Continue extension is deleted before this is saved.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: test-extensions-cache
      with:
        path: extensions/vscode/e2e/.test-extensions
        key: ${{ runner.os }}-vscode-test-extensions-${{ hashFiles('extensions/vscode/scripts/install-e2e-extensions.js') }}

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: storage-cache
      with:
        path: extensions/vscode/e2e/storage
        key: ${{ runner.os }}-vscode-storage-${{ hashFiles('extensions/vscode/package-lock.json', 'extensions/vscode/package.json') }}

    - name: Build packages
      uses: ./.github/actions/setup-packages

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: vscode-extension-build-Linux
        path: extensions/vscode/build

    - name: Install and download e2e dependencies
      shell: bash
      run: |
        if [ "${{ steps.core-node-modules-cache.outputs.cache-hit }}" != "true" ]; then
          (cd core && npm ci)
        fi
        # The extension install and the VS Code download are cached separately.
        # A hit on the download must not skip npm ci, or tsc is missing.
        if [ "${{ steps.vscode-node-modules-cache.outputs.cache-hit }}" != "true" ]; then
          (cd extensions/vscode && npm ci)
        fi
        if [ "${{ steps.storage-cache.outputs.cache-hit }}" != "true" ]; then
          (cd extensions/vscode && npm run e2e:ci:download)
        fi
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    # Saved here, straight after the install and the download, so the entries hold the clean
    # state and a test failure later does not lose them.
    - name: Save extension node_modules
      if: steps.vscode-node-modules-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: extensions/vscode/node_modules
        key: ${{ steps.vscode-node-modules-cache.outputs.cache-primary-key }}

    - name: Save VS Code download
      if: steps.storage-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: extensions/vscode/e2e/storage
        key: ${{ steps.storage-cache.outputs.cache-primary-key }}

    - name: Fix VSCode binary permissions
      shell: bash
      run: |
        chmod +x extensions/vscode/e2e/storage/VSCode-linux-x64/code
        chmod +x extensions/vscode/e2e/storage/chromedriver-linux64/chromedriver

    - name: Set up SSH
      if: ${{ inputs.ssh_key != '' && inputs.ssh_host != '' && inputs.is_fork == 'false' }}
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_HOST: ${{ inputs.ssh_host }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        echo -e "Host ssh-test-container\n\tHostName $SSH_HOST\n\tUser ec2-user\n\tIdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config

    - name: Set up Xvfb
      shell: bash
      run: |
        Xvfb :99 &
        export DISPLAY=:99

    - name: Run e2e tests
      shell: bash
      run: |
        cd extensions/vscode
        IGNORE_SSH_TESTS="${{ inputs.is_fork }}" TEST_FILE="${{ inputs.test_file }}" npm run ${{ inputs.command }}
      env:
        DISPLAY: :99

    - name: Delete continue from test extensions
      shell: bash
      run: |
        cd extensions/vscode
        rm -rf e2e/.test-extensions/continue*

    - name: Save test extensions
      if: steps.test-extensions-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: extensions/vscode/e2e/.test-extensions
        key: ${{ steps.test-extensions-cache.outputs.cache-primary-key }}

    - uses: ./.github/actions/cache-report
      if: always()
      with:
        entries: |
          vscode-node-modules|${{ steps.vscode-node-modules-cache.outcome }}|${{ steps.vscode-node-modules-cache.outputs.cache-hit }}|${{ steps.vscode-node-modules-cache.outputs.cache-matched-key }}
          core-node-modules|${{ steps.core-node-modules-cache.outcome }}|${{ steps.core-node-modules-cache.outputs.cache-hit }}|${{ steps.core-node-modules-cache.outputs.cache-matched-key }}
          vscode-test-extensions|${{ steps.test-extensions-cache.outcome }}|${{ steps.test-extensions-cache.outputs.cache-hit }}|${{ steps.test-extensions-cache.outputs.cache-matched-key }}
          vscode-storage|${{ steps.storage-cache.outcome }}|${{ steps.storage-cache.outputs.cache-hit }}|${{ steps.storage-cache.outputs.cache-matched-key }}

    - name: Sanitize test file name
      id: sanitize_filename
      if: always()
      shell: bash
      run: |
        FILENAME="${{ inputs.test_file }}"
        SANITIZED_FILENAME="${FILENAME//\//-}" # Replace / with - using bash parameter expansion
        echo "sanitized_test_file=${SANITIZED_FILENAME}" >> $GITHUB_OUTPUT

    - name: Upload e2e test screenshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-failure-screenshots-${{ steps.sanitize_filename.outputs.sanitized_test_file || 'unknown' }}-${{ inputs.command == 'e2e:ci:run-yaml' && 'yaml' || 'json' }}
        path: extensions/vscode/e2e/storage/screenshots

    - name: Find e2e log file
      if: always()
      shell: bash
      run: |
        echo "Searching for e2e.log file..."
        find $GITHUB_WORKSPACE -name "e2e.log" -type f

    - name: Upload e2e logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-logs-${{ steps.sanitize_filename.outputs.sanitized_test_file || 'unknown' }}-${{ inputs.command == 'e2e:ci:run-yaml' && 'yaml' || 'json' }}
        path: extensions/vscode/e2e.log
