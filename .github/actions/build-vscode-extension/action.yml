name: "Build VS Code Extension"
description: "Build VS Code extension for a specific platform"
inputs:
  platform:
    description: "Target platform (win32, linux, alpine, darwin)"
    required: true
  arch:
    description: "Target architecture (x64, arm64, armhf)"
    required: true
  npm_config_arch:
    description: "npm config arch (x64, arm64, arm)"
    required: true
  pre-release:
    description: "Whether to build as pre-release"
    required: false
    default: "false"
  commit-sha:
    description: "Commit SHA for version modification (optional, uses first 7 chars, as -g<sha>)"
    required: false
    default: ""
  github-token:
    description: "Unused; kept so existing callers keep working (ripgrep now comes from npm)"
    required: false
  cache:
    description: "Use caches (built packages, node_modules, npm downloads, the sqlite3 prebuilt). Release builds pass 'false' so that nothing restored from a cache reaches a shipped artefact."
    required: false
    default: "true"
outputs:
  target:
    description: "The target string used for the build"
    value: ${{ steps.set-target.outputs.target }}
  vsix-path:
    description: "Path to the generated VSIX file"
    value: "extensions/vscode/*.vsix"
  build-path:
    description: "Path to the build artifacts"
    value: "extensions/vscode/build"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      id: node
      with:
        node-version-file: ".nvmrc"

    - name: Set target variable
      id: set-target
      shell: bash
      run: echo "target=${{ inputs.platform }}-${{ inputs.arch }}" >> $GITHUB_OUTPUT

    # The built packages (and their cache) come from the setup-packages action.
    - name: Build packages
      uses: ./.github/actions/setup-packages
      with:
        cache: ${{ inputs.cache }}

    # Cache policy (docs/ci-caching.md). node_modules is restored, never saved, here: this action
    # mutates core/node_modules (vectordb, prepackage) and the extension's (esbuild), so the clean
    # copies come from the setup-component action, which saves right after `npm ci`. It is Linux
    # only: restoring hundreds of thousands of small files costs more than `npm ci` on the Windows
    # and macOS runners. The npm download cache is saved from main only.
    - name: Restore extension node_modules
      id: ext-nm
      if: inputs.cache == 'true' && runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: extensions/vscode/node_modules
        key: ${{ runner.os }}-vscode-node-modules-node${{ steps.node.outputs.node-version }}-${{ hashFiles('extensions/vscode/package-lock.json') }}

    - name: Restore gui node_modules
      id: gui-nm
      if: inputs.cache == 'true' && runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: gui/node_modules
        key: ${{ runner.os }}-gui-node-modules-node${{ steps.node.outputs.node-version }}-${{ hashFiles('gui/package-lock.json') }}

    - name: Restore core node_modules
      id: core-nm
      if: inputs.cache == 'true' && runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: core/node_modules
        key: ${{ runner.os }}-core-node-modules-node${{ steps.node.outputs.node-version }}-${{ hashFiles('core/package-lock.json') }}

    - name: Restore npm download cache
      id: npm-cache
      if: inputs.cache == 'true' && runner.os != 'Windows' && (runner.os != 'Linux' || steps.ext-nm.outputs.cache-hit != 'true' || steps.gui-nm.outputs.cache-hit != 'true' || steps.core-nm.outputs.cache-hit != 'true')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-cache-build-${{ hashFiles('extensions/vscode/package-lock.json', 'gui/package-lock.json', 'core/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-cache-build-

    - name: Install extension dependencies
      if: steps.ext-nm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd extensions/vscode
        npm ci

    - name: Install gui dependencies
      if: steps.gui-nm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd gui
        npm ci

    - name: Install core dependencies
      shell: bash
      run: |
        cd core
        if [ "${{ steps.core-nm.outputs.cache-hit }}" != "true" ]; then
          npm ci
        fi
        npm i vectordb

    - name: Save npm download cache
      if: inputs.cache == 'true' && steps.npm-cache.outcome == 'success' && steps.npm-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}

    - name: Build GUI
      shell: bash
      run: |
        cd gui
        npm run build --max-old-space-size=4096
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"

    # The pre-built sqlite3 binary comes from GitHub releases, which has returned 504s
    # (the PR checks log: "Download failed (status code: 504)"). Cache the extracted build
    # after npm ci, which would otherwise wipe it; download-copy-sqlite.js skips its download
    # when the marker in the build matches. Keyed per target, since the build is one target's.
    # Bump the key when SQLITE_VERSION changes.
    - name: Restore sqlite3 prebuilt
      id: sqlite-prebuilt-cache
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: core/node_modules/sqlite3/build
        key: ${{ runner.os }}-sqlite3-prebuilt-v5.1.7-${{ steps.set-target.outputs.target }}

    - name: Prepackage the extension
      shell: bash
      env:
        CONTINUE_VSCODE_TARGET: ${{ steps.set-target.outputs.target }}
      run: |
        cd extensions/vscode
        export CONTINUE_VSCODE_TARGET="${{ steps.set-target.outputs.target }}"
        npm run prepackage -- --target ${{ steps.set-target.outputs.target }}

    - name: Save sqlite3 prebuilt
      if: inputs.cache == 'true' && steps.sqlite-prebuilt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: core/node_modules/sqlite3/build
        key: ${{ steps.sqlite-prebuilt-cache.outputs.cache-primary-key }}

    - name: Re-install esbuild
      shell: bash
      run: |
        cd extensions/vscode
        npm install -f esbuild

    - name: Modify package.json version with commit SHA
      if: inputs.commit-sha != ''
      shell: bash
      run: |
        cd extensions/vscode
        # Get current version from package.json
        CURRENT_VERSION=$(node -p "require('./package.json').version")

        # Create new version with short commit SHA (first 7 chars). The "g"
        # prefix (as in git describe) keeps the pre-release identifier
        # alphanumeric: a SHA like 0168024 is all digits with a leading zero,
        # which semver forbids, and vsce then rejects the version.
        COMMIT_SHORT="${{ inputs.commit-sha }}"
        NEW_VERSION="${CURRENT_VERSION}-g${COMMIT_SHORT:0:7}"

        echo "📝 Updating package.json version from $CURRENT_VERSION to $NEW_VERSION"

        # Update version in package.json
        sed -i.bak "s/\"version\": \"$CURRENT_VERSION\"/\"version\": \"$NEW_VERSION\"/" package.json

        # Remove backup file
        rm -f package.json.bak

        # Verify the change
        echo "✅ New version: $(node -p "require('./package.json').version")"

    - name: Package extension (build artifacts)
      shell: bash
      env:
        CONTINUE_VSCODE_TARGET: ${{ steps.set-target.outputs.target }}
      run: |
        cd extensions/vscode
        export CONTINUE_VSCODE_TARGET="${{ steps.set-target.outputs.target }}"
        npm run package -- --target ${{ steps.set-target.outputs.target }}

    - name: Package extension (.vsix files)
      shell: bash
      env:
        CONTINUE_VSCODE_TARGET: ${{ steps.set-target.outputs.target }}
      run: |
        cd extensions/vscode
        export CONTINUE_VSCODE_TARGET="${{ steps.set-target.outputs.target }}"
        if [ "${{ inputs.pre-release }}" = "true" ]; then
          npx vsce package --pre-release --no-dependencies --target ${{ steps.set-target.outputs.target }}
        else
          npx vsce package --no-dependencies --target ${{ steps.set-target.outputs.target }}
        fi
        # LICENSE, NOTICE and the generated third-party notices must be in every VSIX
        for f in *.vsix; do node ../../scripts/ci/check-artefact-licences.mjs --vsix "$f"; done

    - uses: ./.github/actions/cache-report
      if: always()
      with:
        entries: |
          vscode-node-modules|${{ steps.ext-nm.outcome }}|${{ steps.ext-nm.outputs.cache-hit }}|${{ steps.ext-nm.outputs.cache-matched-key }}
          gui-node-modules|${{ steps.gui-nm.outcome }}|${{ steps.gui-nm.outputs.cache-hit }}|${{ steps.gui-nm.outputs.cache-matched-key }}
          core-node-modules|${{ steps.core-nm.outcome }}|${{ steps.core-nm.outputs.cache-hit }}|${{ steps.core-nm.outputs.cache-matched-key }}
          npm-build|${{ steps.npm-cache.outcome }}|${{ steps.npm-cache.outputs.cache-hit }}|${{ steps.npm-cache.outputs.cache-matched-key }}
          sqlite3-prebuilt|${{ steps.sqlite-prebuilt-cache.outcome }}|${{ steps.sqlite-prebuilt-cache.outputs.cache-hit }}|${{ steps.sqlite-prebuilt-cache.outputs.cache-matched-key }}
