name: Submit Gradle Dependency Graph For Dependabot

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 17
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          # The gradle project is not in the root of the repository.
          build-root-directory: extensions/intellij
          # Report only what the plugin ships. The plugin bundles no
          # third-party libraries: the IntelliJ Platform (and the log4j 1.x,
          # Netty, Jackson, Bouncy Castle, LZ4 ... inside it) is supplied by
          # the IDE at runtime, and the test frameworks only run in CI.
          # Submitting every resolved configuration raised dozens of alerts
          # for jars this repository neither ships nor can upgrade.
          dependency-graph-include-configurations: "^runtimeClasspath$"
