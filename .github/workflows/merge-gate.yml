name: Merge Gate

# The ONE status check to require on `main` (job name: `merge-gate`). See docs/ci-merge-gate.md.
#
# One workflow, no polling. A `changes` job decides which areas the change touches, the PR and CLI
# checks run as called workflows (pr-checks.yaml, cli-pr-checks.yml), and `merge-gate` is a plain
# aggregate over `needs` that reports in seconds. It holds no runner while others work: it starts
# only after every job it needs has finished. This workflow has no path filter, so it always
# reports, and a docs-only change gets a green gate with no code jobs behind it.
#
# Why there are no `paths-ignore` filters any more: a required check whose workflow is skipped by a
# path filter never reports and blocks the PR forever. The filter lives in `changes`
# (scripts/ci/changed-areas.mjs) instead, where a skipped job still lets the gate report.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      draft: ${{ steps.areas.outputs.draft }}
      code: ${{ steps.areas.outputs.code }}
      prettier: ${{ steps.areas.outputs.prettier }}
      core: ${{ steps.areas.outputs.core }}
      gui: ${{ steps.areas.outputs.gui }}
      binary: ${{ steps.areas.outputs.binary }}
      vscode: ${{ steps.areas.outputs.vscode }}
      packages: ${{ steps.areas.outputs.packages }}
      e2e: ${{ steps.areas.outputs.e2e }}
      jetbrains: ${{ steps.areas.outputs.jetbrains }}
      cli: ${{ steps.areas.outputs.cli }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide which areas this change touches
        id: areas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          draft=false
          case "$EVENT" in
            pull_request)
              # Live state from the API, not the event payload: a re-run of a run that started while
              # the PR was a draft carries `draft: true` forever, which is how the old gate stayed
              # red after "ready for review".
              draft=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.draft')
              # --no-renames lists a renamed file under both its old and its new name.
              git diff --no-renames --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > "$RUNNER_TEMP/files.txt"
              ;;
            merge_group)
              git diff --no-renames --name-only "$MG_BASE_SHA" "$MG_HEAD_SHA" > "$RUNNER_TEMP/files.txt"
              ;;
            *)
              : > "$RUNNER_TEMP/files.txt"
              ;;
          esac

          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            node scripts/ci/changed-areas.mjs < "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/areas.txt"
          else
            node scripts/ci/changed-areas.mjs --all > "$RUNNER_TEMP/areas.txt"
          fi
          { echo "draft=$draft"; cat "$RUNNER_TEMP/areas.txt"; } | tee -a "$GITHUB_OUTPUT"

          {
            echo "### Changed files ($(wc -l < "$RUNNER_TEMP/files.txt"))"
            echo '```'
            head -n 200 "$RUNNER_TEMP/files.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-checks:
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/pr-checks.yaml
    secrets: inherit
    with:
      run_prettier: ${{ needs.changes.outputs.prettier }}
      run_core: ${{ needs.changes.outputs.core }}
      run_gui: ${{ needs.changes.outputs.gui }}
      run_binary: ${{ needs.changes.outputs.binary }}
      run_vscode: ${{ needs.changes.outputs.vscode }}
      run_packages: ${{ needs.changes.outputs.packages }}
      run_e2e: ${{ needs.changes.outputs.e2e }}
      run_jetbrains: ${{ needs.changes.outputs.jetbrains }}

  cli-pr-checks:
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.code == 'true' && needs.changes.outputs.cli == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/cli-pr-checks.yml
    secrets: inherit

  # The aggregate. `if: always()` makes it run (and report) even when a needed job failed or was
  # skipped; a plain job-level skip would report success to branch protection.
  merge-gate:
    needs: [changes, pr-checks, cli-pr-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate the needed jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          out() { jq -r --arg k "$1" '.changes.outputs[$k] // ""' <<<"$NEEDS"; }
          result() { jq -r --arg j "$1" '.[$j].result' <<<"$NEEDS"; }

          failed=0
          fail() { echo "::error::$*"; failed=1; }
          {
            echo "### merge-gate"
            echo "| job | expected | result |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Without the filter's answer nothing can be judged: fail, never guess.
          changes=$(result changes)
          if [ "$changes" != "success" ]; then
            echo "| changes | run | $changes |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The changes job concluded '$changes'; the gate cannot tell what was meant to run."
            exit 1
          fi

          draft=$(out draft); code=$(out code); cli=$(out cli)

          # A job may be skipped only when the filter or the draft state said so. Anything else
          # that is not `success` (failure, cancelled, an unexpected skip) fails the gate.
          check() { # name, expected (run|skip), reason for a skip
            local name=$1 expected=$2 why=$3 r
            r=$(result "$name")
            echo "| $name | $expected${why:+ ($why)} | $r |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name: expected $expected, result $r"
            case "$r" in
              success) ;;
              skipped) [ "$expected" = skip ] || fail "$name was skipped but had to run" ;;
              *) fail "$name concluded '$r'" ;;
            esac
          }

          if [ "$draft" = "true" ]; then
            echo "::notice::Draft PR: the code checks are not run for drafts and the gate passes. GitHub does not merge a draft. Marking the PR ready starts a new run that runs the checks."
            check pr-checks skip "draft"
            check cli-pr-checks skip "draft"
          elif [ "$code" != "true" ]; then
            echo "::notice::Docs-only change: no code checks to run."
            check pr-checks skip "docs only"
            check cli-pr-checks skip "docs only"
          else
            check pr-checks run ""
            if [ "$cli" = "true" ]; then check cli-pr-checks run ""; else check cli-pr-checks skip "no CLI, core or packages change"; fi
          fi

          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "merge-gate: every needed job succeeded or was skipped on purpose."
