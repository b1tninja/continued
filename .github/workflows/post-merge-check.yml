name: Post-merge check

# CI15: two pull requests that were each green alone can break `main` together (#553 x #557 TS2741,
# #587 x #588 lint complexity). Nothing built the merged result. This builds the tip of `main` after
# every push with the same type-check and lint commands the PR checks run, runs the full unit suites
# of core, gui and the CLI (pull requests may run only the tests affected by their change,
# docs/ci-merge-gate.md section 9), and keeps ONE issue open while main is red (closed again when a
# later push is green). See docs/ci-merge-gate.md section 6.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only the newest tip matters: a newer push supersedes the run in flight.
concurrency:
  group: post-merge-check
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true
      - name: Type check and lint
        run: |
          cd core
          npx tsc --noEmit
          npm run lint
      # Pull requests may run only the tests related to their change (scripts/ci/affected-tests.mjs);
      # main runs the full suites after every merge, as well as nightly. No API keys here.
      - name: Full unit tests
        run: |
          cd core
          npm test
          npm run vitest
        env:
          IGNORE_API_KEY_TESTS: "true"

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true
      - name: Setup gui component
        uses: ./.github/actions/setup-component
        with:
          component: gui
          include-packages: false
      - name: Type check and lint
        run: |
          cd gui
          npx tsc --noEmit
          npm run lint
      - name: Full unit tests
        run: |
          cd gui
          npm test

  # The CLI unit suite, which pull requests may narrow, in full.
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true
      - name: Full unit tests
        run: |
          (cd core && npm run build)
          cd extensions/cli
          npm ci --include=optional
          npm test

  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup packages
        uses: ./.github/actions/setup-packages
      - name: Setup core component
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true
      - name: Setup binary component
        uses: ./.github/actions/setup-component
        with:
          component: binary
          include-packages: false
      - name: Type check
        run: |
          cd binary
          npx tsc --noEmit

  report:
    # No checkout and no third-party action: only the preinstalled gh and the built-in token.
    needs: [core, gui, binary, cli]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: ${{ needs.core.result }} ${{ needs.gui.result }} ${{ needs.binary.result }} ${{ needs.cli.result }}
      TITLE: "main is red: post-merge check failed"
    steps:
      - name: Report the result
        run: |
          set -eu
          red=no
          case " $RESULTS " in
            *" failure "*|*" skipped "*) red=yes ;;
          esac
          if [ "$red" = yes ]; then
            echo "main is red at $SHA (core, gui, binary, cli: $RESULTS). Run: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "main is green at $SHA (core, gui, binary, cli: $RESULTS)." >> "$GITHUB_STEP_SUMMARY"
          fi
          # A tracking issue is a convenience, only where the repository has issues turned on
          # (this fork does not): the red run itself is the signal either way.
          if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" = true ]; then
            existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title               --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
            if [ "$red" = yes ]; then
              body="Commit $SHA on main failed the post-merge check (results in order core, gui, binary, cli: $RESULTS). Run: $RUN_URL. Usually two pull requests that were each green alone; find the pair with node scripts/ci/merge-ready.mjs --trial."
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --body "$body"
              else
                gh issue create --title "$TITLE" --body "$body"
              fi
            elif [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Green again at $SHA: $RUN_URL"
            fi
          fi
          # The run is the alarm: red when main is red, green when it is green.
          [ "$red" = no ]
