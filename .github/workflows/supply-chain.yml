name: Supply Chain

# Advisory checks, NOT required: the merge gate (docs/ci-merge-gate.md) waits only for the two
# aggregate jobs in its REQUIRED_CHECKS, so nothing here can block or stall a merge. Do not add these
# jobs to an aggregate `needs`. Policy: docs/supply-chain.md.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "plans/**"
      - "**/*.md"
      - "**/*.mdx"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # v5.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          # Licence check on changed dependencies (runtime scope). Strong copyleft and
          # non-commercial or source-available licences are denied; LGPL is not on the list
          # because sharp's prebuilt libvips (LGPL, dynamically loaded) is already shipped
          # and reviewed (scripts/licenses/exceptions.json). Checked on 2026-11-11 against all
          # lockfiles: only three runtime or dev packages carry a denied id, each in a
          # dual-licence expression with a permissive option, so they are allowed by purl:
          #   node-forge (BSD-3-Clause OR GPL-2.0), elkjs (EPL-2.0 OR GPL-3.0-or-later),
          #   jszip (MIT OR GPL-3.0-or-later).
          # mintlify (Elastic-2.0) is docs tooling in the dev scope, which is not evaluated.
          # The build-time gate for what ships is scripts/licenses/third-party-notices.mjs.
          license-check: true
          deny-licenses: GPL-2.0, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, Elastic-2.0, CC-BY-NC-3.0, CC-BY-NC-4.0, CC-BY-NC-SA-3.0, CC-BY-NC-SA-4.0, CC-BY-NC-ND-4.0
          allow-dependencies-licenses: pkg:npm/node-forge, pkg:npm/elkjs, pkg:npm/jszip

  pins-and-notice:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pin policy
        run: |
          node scripts/ci/check-pins.mjs
          node --test scripts/ci/check-pins.test.mjs
      - name: Fixture provenance and licences (strict)
        run: |
          node scripts/ci/check-notice.mjs --strict
          node --test scripts/ci/check-notice.test.mjs scripts/ci/backfill-fixture-licence.test.mjs
      - name: Shipped legal files (artefact checker and notices generator tests)
        run: node --test scripts/ci/check-artefact-licences.test.mjs scripts/licenses/third-party-notices.test.mjs
      - name: Process-guard scripts (merge-tree matrix, worktree hygiene, stash guard, checkpoint)
        run: node --test scripts/ci/combine.test.mjs scripts/ci/check-stash.test.mjs scripts/ci/worktree-hygiene.test.mjs "scripts/agents/*.test.mjs"
      - name: Lab boundary (the product never imports bench/; contract, result schema, governor)
        run: |
          node scripts/ci/check-bench-boundary.mjs
          node --test scripts/ci/check-bench-boundary.test.mjs bench/lab/test/contract.test.mjs
